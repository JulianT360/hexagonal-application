quarkus.application.name=hexagonal-application
quarkus.http.port=8080

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."com.weatherapp".level=DEBUG

# --- Swagger Configuration ---
quarkus.swagger-ui.always-include=true

# --- Jackson Configuration ---
quarkus.jackson.fail-on-unknown-properties=false

# --- Health check configuration ---
quarkus.smallrye-health.root-path=/health

# --- Fault tolerance config ---
# Retry
fault-tolerance.retry.max-retries=3
fault-tolerance.retry.delay=500

# Timeout
fault-tolerance.timeout=3000

# Circuit Breaker
fault-tolerance.circuit-breaker.request-volume-threshold=5
fault-tolerance.circuit-breaker.failure-ratio=0.5
fault-tolerance.circuit-breaker.delay=10000

# --- OpenWeatherMap reactive REST client ---
quarkus.rest-client.openweather-api.url=https://api.openweathermap.org
quarkus.rest-client.openweather-api.scope=jakarta.inject.Singleton
quarkus.rest-client.openweather-api.connect-timeout=5000
quarkus.rest-client.openweather-api.read-timeout=5000

# --- OpenWeather API Configuration
openweather.client.units=metric
openweather.client.language=es
# API Key: Set up env variable with api key or replace it
openweather.api-key=${OPENWEATHER_API_KEY}

