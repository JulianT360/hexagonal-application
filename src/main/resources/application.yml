quarkus:
  application:
    name: weather-service
  http:
    port: 8080

  rest-client:
    openweather-api:
      url: https://api.openweathermap.org
      connect-timeout: 5000
      read-timeout: 5000

  log:
    level: INFO
    category:
      "com.julian.weather":
        level: DEBUG

  swagger-ui:
    always-include: true

  jackson:
    fail-on-unknown-properties: false

  smallrye-health:
    root-path: /health

openweather:
  api-key: ${OPENWEATHER_API_KEY}
  client:
    units: metric
    language: es